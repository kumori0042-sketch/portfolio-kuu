<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q&A — 개발자KUU</title>
<meta name="description" content="개발자KUU에게 무엇이든 물어보세요.">
<meta name="theme-color" content="#3182F6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400;500;600;700;800;900&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="qna.css">
</head>
<body>

  <header class="qna-header">
    <div class="wrap qna-header-inner">
      <a class="qna-brand" href="index.html">개발자KUU</a>
      <a class="qna-back" href="index.html">← 포트폴리오로</a>
    </div>
  </header>

  <main>
    <section class="qna-hero">
      <div class="wrap">
        <p class="section-eyebrow">Q&amp;A</p>
        <h1 class="section-title" style="font-size:clamp(1.9rem,4.5vw,2.6rem);">무엇이든 물어보세요</h1>
        <p class="section-lede">프로젝트, 기술 선택, 혹은 그냥 궁금한 것. 여기 남기시면 직접 답합니다.</p>
      </div>
    </section>

    <section class="qna-ask-section">
      <div class="wrap">
        <div class="ask-card">
          <div class="field">
            <label class="k" for="ask-name">이름 (선택)</label>
            <input type="text" id="ask-name" placeholder="익명이어도 괜찮아요">
          </div>
          <div class="field">
            <label class="k" for="ask-question">질문</label>
            <textarea id="ask-question" rows="3" placeholder="궁금한 걸 편하게 적어주세요."></textarea>
          </div>
          <button type="button" id="btn-ask-submit" class="btn btn-primary">질문 남기기</button>
          <p id="ask-status" class="status-line" hidden></p>
        </div>
      </div>
    </section>

    <section class="qna-list-section">
      <div class="wrap">
        <div class="qna-list-head">
          <p class="section-eyebrow" style="margin:0;">ALL QUESTIONS</p>
          <span id="qna-count" class="qna-count mono"></span>
        </div>
        <div id="qna-empty" class="empty-state" hidden>
          <p>아직 질문이 없어요. 첫 질문을 남겨보세요.</p>
        </div>
        <div id="qna-list" class="qna-list"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <div class="footer-brand">개발자KUU</div>
      <div class="footer-links">
        <a href="index.html">포트폴리오</a>
        <a href="https://github.com/kumori0042-sketch" target="_blank" rel="noopener">GitHub</a>
      </div>
    </div>
  </footer>

<script src="qna.js"></script>
</body>
</html>
