<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q&A — 개발자KUU</title>
<meta name="description" content="개발자KUU에게 무엇이든 물어보세요.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://portfolio-kuu-beta.vercel.app/qna.html">
<meta property="og:site_name" content="개발자KUU">
<meta property="og:title" content="Q&A — 개발자KUU">
<meta property="og:description" content="개발자KUU에게 무엇이든 물어보세요.">
<meta property="og:image" content="https://portfolio-kuu-beta.vercel.app/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Q&A — 개발자KUU">
<meta name="twitter:description" content="개발자KUU에게 무엇이든 물어보세요.">
<meta name="twitter:image" content="https://portfolio-kuu-beta.vercel.app/og-image.png">
<meta name="theme-color" content="#3182F6">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="qna.css">
</head>
<body>
<script src="common.js"></script>
<script src="i18n.js"></script>

  <header class="qna-header">
    <div class="wrap qna-header-inner">
      <a class="qna-brand" href="index.html">개발자KUU</a>
      <div class="qna-header-right">
        <div class="lang-switch">
          <button type="button" data-lang="ko">한</button>
          <button type="button" data-lang="ja">日</button>
          <button type="button" data-lang="en">EN</button>
        </div>
        <div id="auth-area" class="auth-area"></div>
        <a class="qna-back" href="index.html" data-i18n="qna.back">← 포트폴리오로</a>
      </div>
    </div>
  </header>

  <main>
    <section class="qna-hero">
      <div class="wrap">
        <p class="section-eyebrow" data-i18n="qna.eyebrow">Q&amp;A</p>
        <h1 class="section-title" style="font-size:clamp(1.9rem,4.5vw,2.6rem);" data-i18n="qna.title">무엇이든 물어보세요</h1>
        <p class="section-lede" data-i18n="qna.lede">프로젝트, 기술 선택, 혹은 그냥 궁금한 것. 여기 남기시면 직접 답합니다.</p>
      </div>
    </section>

    <section class="qna-ask-section">
      <div class="wrap">
        <div class="ask-card">
          <div class="field" id="ask-name-field">
            <label class="k" for="ask-name" data-i18n="qna.nameLabel">이름 (선택)</label>
            <input type="text" id="ask-name" placeholder="익명이어도 괜찮아요" data-i18n-placeholder="qna.namePlaceholder">
          </div>
          <p id="ask-as" class="ask-as" hidden></p>
          <div class="field">
            <label class="k" for="ask-question" data-i18n="qna.questionLabel">질문</label>
            <textarea id="ask-question" rows="3" placeholder="궁금한 걸 편하게 적어주세요." data-i18n-placeholder="qna.questionPlaceholder"></textarea>
          </div>
          <button type="button" id="btn-ask-submit" class="btn btn-primary" data-i18n="qna.submit">질문 남기기</button>
          <p id="ask-status" class="status-line" hidden></p>
        </div>
      </div>
    </section>

    <section class="qna-list-section">
      <div class="wrap">
        <div class="qna-list-head">
          <p class="section-eyebrow" style="margin:0;" data-i18n="qna.listHead">ALL QUESTIONS</p>
          <span id="qna-count" class="qna-count mono"></span>
        </div>
        <div id="qna-empty" class="empty-state" hidden>
          <p data-i18n="qna.empty">아직 질문이 없어요. 첫 질문을 남겨보세요.</p>
        </div>
        <div id="qna-list" class="qna-list"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <div class="footer-brand">개발자KUU</div>
      <div class="footer-links">
        <a href="index.html" data-i18n="footer.portfolio">포트폴리오</a>
        <a href="https://github.com/kumori0042-sketch" target="_blank" rel="noopener">GitHub</a>
      </div>
    </div>
  </footer>

  <button type="button" id="theme-toggle" class="theme-toggle" aria-label="테마 전환" title="라이트/다크 전환" data-i18n-aria-label="a11y.theme" data-i18n-title="a11y.themeTitle">🌓</button>

<script src="qna.js"></script>
</body>
</html>
