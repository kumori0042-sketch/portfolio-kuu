<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Mono, ui-monospace, monospace">
  <rect x="0" y="0" width="800" height="500" fill="#FFFFFF"/>

  <text x="60" y="55" font-size="22" font-weight="800" fill="#191F28">진입 필터 파이프라인</text>
  <text x="60" y="82" font-size="15" fill="#8B95A1">기술지표부터 AI 신호까지, 순서대로 통과해야 진입</text>

  <!-- 단계 카드들 -->
  <g font-size="17" font-weight="700" fill="#191F28">
    <rect x="60" y="115" width="680" height="56" rx="12" fill="#EBF2FF" stroke="#3182F6" stroke-width="1.5"/>
    <text x="86" y="150">01  기술지표 (ADX · RSI · DI Gap)</text>

    <rect x="60" y="183" width="680" height="56" rx="12" fill="#EBF2FF" stroke="#3182F6" stroke-width="1.5"/>
