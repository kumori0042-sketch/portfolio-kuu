    <rect x="60" y="251" width="680" height="56" rx="12" fill="#EBF2FF" stroke="#3182F6" stroke-width="1.5"/>
    <text x="86" y="286">03  OI · Taker 매수/매도 비율</text>

    <rect x="60" y="319" width="680" height="56" rx="12" fill="#EBF2FF" stroke="#3182F6" stroke-width="1.5"/>
    <text x="86" y="354">04  AI 신호 블렌딩 (공포·탐욕 · 펀딩비)</text>

    <rect x="60" y="387" width="680" height="56" rx="12" fill="#3182F6"/>
    <text x="86" y="422" fill="#FFFFFF">05  진입 실행 (Maker 전용)</text>
  </g>

  <!-- 화살표 -->
  <g stroke="#8B95A1" stroke-width="2" fill="none">
    <line x1="400" y1="171" x2="400" y2="181"/>
    <line x1="400" y1="239" x2="400" y2="249"/>
    <line x1="400" y1="307" x2="400" y2="317"/>
    <line x1="400" y1="375" x2="400" y2="385"/>
  </g>
