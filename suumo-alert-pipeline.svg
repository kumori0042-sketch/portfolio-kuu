<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Mono, ui-monospace, monospace">
  <rect x="0" y="0" width="800" height="500" fill="#FFFFFF"/>

  <text x="60" y="50" font-size="22" font-weight="800" fill="#191F28">매물 판정 파이프라인</text>
  <text x="60" y="76" font-size="15" fill="#8B95A1">조건별로 수집하고, 달라진 매물만 깊게 읽는다</text>

  <g font-size="16" font-weight="700" fill="#191F28">
    <rect x="60" y="96" width="680" height="50" rx="12" fill="#EBF2FF" stroke="#3182F6" stroke-width="1.5"/>
    <text x="84" y="127">01  목록 수집 (조건별 검색 · 요청 간격 30초)</text>

    <rect x="60" y="158" width="680" height="50" rx="12" fill="#EBF2FF" stroke="#3182F6" stroke-width="1.5"/>
    <text x="84" y="189">02  1차 필터 (면적 · 가격 · 도보 · 간취 · 준공연도)</text>

    <rect x="60" y="220" width="680" height="50" rx="12" fill="#EBF2FF" stroke="#3182F6" stroke-width="1.5"/>
    <text x="84" y="251">03  새 매물 · 가격 변동만 상세 조회</text>

    <rect x="60" y="282" width="680" height="50" rx="12" fill="#EBF2FF" stroke="#3182F6" stroke-width="1.5"/>
    <text x="84" y="313">04  2차 필터 (세대수 · 借地権) + 경고 태그</text>

    <rect x="60" y="344" width="680" height="50" rx="12" fill="#EBF2FF" stroke="#3182F6" stroke-width="1.5"/>
    <text x="84" y="375">05  역별 ㎡단가 중앙값 비교 · 가격 인하 감지</text>

    <rect x="60" y="406" width="680" height="50" rx="12" fill="#3182F6"/>
    <text x="84" y="437" fill="#FFFFFF">06  Discord 알림 (⭐ 저장 · 🗑 삭제 버튼)</text>
  </g>

  <g stroke="#8B95A1" stroke-width="2" fill="none">
    <line x1="400" y1="146" x2="400" y2="156"/>
    <line x1="400" y1="208" x2="400" y2="218"/>
    <line x1="400" y1="270" x2="400" y2="280"/>
    <line x1="400" y1="332" x2="400" y2="342"/>
    <line x1="400" y1="394" x2="400" y2="404"/>
  </g>
</svg>
